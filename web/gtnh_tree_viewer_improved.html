<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTNH 合成树</title>
<style>
  :root {
    --bg: #101418;
    --panel: #171d24;
    --panel2: #1e2630;
    --border: #2a3440;
    --text: #dbe4ee;
    --muted: #8aa0b5;
    --accent: #4fc3f7;
    --leaf: #a7c8a0;
    --warn: #e6b455;
    --line: #33404f;
    --graph-grid: rgba(140,160,180,.055);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 18px;
    background: linear-gradient(180deg, #141a21, #101418);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  button, .btn {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); color: #fff; }
  .dropzone { display: none; }
  #wrap { max-width: 1400px; margin: 0 auto; padding: 18px; }
  .view-switch { display: inline-flex; gap: 4px; padding: 3px; background: #11171d; border: 1px solid var(--border); border-radius: 8px; }
  .view-switch button { border: 0; background: transparent; padding: 6px 10px; }
  .view-switch button.active { background: var(--accent); color: #07131a; box-shadow: 0 2px 8px rgba(79,195,247,.2); }
  .graph-toolbar { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; flex-wrap: wrap; }
  .graph-toolbar .hinttext { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .graph-viewport { position: relative; height: calc(100vh - 145px); min-height: 520px; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background-color: #0d1218; background-image: linear-gradient(var(--graph-grid) 1px, transparent 1px), linear-gradient(90deg, var(--graph-grid) 1px, transparent 1px); background-size: 32px 32px; cursor: grab; user-select: none; touch-action: none; }
  .graph-viewport.dragging { cursor: grabbing; }
  .graph-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .graph-links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .graph-node { position: absolute; width: 220px; min-height: 108px; padding: 10px 12px; border-radius: 10px; background: linear-gradient(180deg, #1a232c, #141b22); border: 1px solid #344352; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
  .graph-node:hover { border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.3), 0 0 0 1px rgba(79,195,247,.12); }
  .graph-node.done { border-color: rgba(34,197,94,.45); }
  .graph-node .node-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .graph-node .graph-toggle { flex: 0 0 22px; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; background: #11171d; }
  .graph-node .graph-toggle.empty { opacity: .45; cursor: default; }
  .graph-node .item-icon { flex: 0 0 32px; width: 32px; height: 32px; margin: 0; }
  .graph-node .graph-name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .graph-node .check { margin-left: auto; }
  .graph-node .amounts { margin-top: 8px; line-height: 1.45; }
  .graph-node .machine { margin-left: 0; margin-top: 6px; }
  .graph-edge { fill: none; stroke: #60758a; stroke-width: 1.8; opacity: .88; }
  .graph-edge-arrow { fill: #60758a; opacity: .88; }
  .graph-view.hidden { display: none; }
  .list-view.hidden { display: none; }
  .stat { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .meta b { color: var(--text); font-weight: 600; }

  .tree { margin-left: 0; }
  .node { margin: 2px 0; }
  .node-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 10px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--border);
  }
  .node-row:hover { border-color: #3d4d5e; }
  .toggle {
    flex: 0 0 18px; height: 18px; margin-top: 1px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
    color: var(--muted); user-select: none; font-size: 12px; line-height: 1;
  }
  .toggle.empty { cursor: default; }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; word-break: break-all; }
  .name .fallback { color: var(--muted); font-weight: 500; }
  .item-icon { display: inline-block; width: 20px; height: 20px; margin-right: 7px;
    vertical-align: -4px; image-rendering: pixelated; image-rendering: crisp-edges; }
  .item-icon.ph { display: inline-block; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 3px; box-sizing: border-box; }
  .check { flex: 0 0 auto; margin-left: auto; align-self: center; cursor: pointer;
    font-size: 16px; line-height: 1; color: var(--muted); user-select: none; padding: 0 2px; }
  .check.done { color: #22c55e; }
  .node-row.done .item-name { color: #22c55e; }
  .machine {
    display: inline-block; margin-left: 8px; padding: 1px 8px;
    font-size: 11px; color: var(--accent);
    background: rgba(79,195,247,.08); border: 1px solid rgba(79,195,247,.25);
    border-radius: 999px; vertical-align: 2px;
  }
  .amounts { margin-top: 3px; font-size: 12px; color: var(--muted); }
  .amounts .need { color: var(--warn); font-weight: 600; }
  .amounts .leaf-note { color: var(--leaf); }
  .amounts .leftover { color: #7f9dbb; }
  .children { margin-left: 22px; padding-left: 12px; border-left: 1px solid var(--line); }
  .hidden { display: none; }
  #drop.hint {
    margin: 30px auto; max-width: 560px; text-align: center;
    padding: 40px 20px; border: 2px dashed var(--border); border-radius: 12px; color: var(--muted);
  }
  #drop.hint strong { color: var(--text); display: block; margin-bottom: 6px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>GTNH 合成树</h1>
  <span class="sub" id="subtitle">数据源：bookmarks.ini（预览版）</span>
  <span class="spacer"></span>
  <div class="view-switch" title="切换合成树展示方式">
    <button id="listMode">列表树</button>
    <button id="graphMode" class="active">横向树</button>
  </div>
  <button id="expandAll">全部展开</button>
  <button id="collapseAll">全部折叠</button>
  <button id="openFile">打开 JSON…</button>
</header>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<div id="wrap">
  <div id="drop" class="hint" style="display:none">
    <strong>把导出的 tree.json 拖到这里</strong>
    或点右上角「打开 JSON…」选择文件
  </div>
  <div id="meta" class="meta"></div>
  <div id="stat" class="stat"></div>
  <div id="tree" class="list-view hidden"></div>
  <div id="graphView" class="graph-view">
    <div class="graph-toolbar">
      <button id="graphFit">适应画布</button>
      <button id="graphZoomOut">−</button>
      <button id="graphZoomIn">+</button>
      <span id="graphZoomLabel" class="hinttext">100%</span>
      <span class="hinttext">拖动画布 · 滚轮缩放 · 点击节点右侧 ✓ 标记完成</span>
    </div>
    <div id="graphViewport" class="graph-viewport">
      <div id="graphStage" class="graph-stage">
        <svg id="graphLinks" class="graph-links"></svg>
        <div id="graphNodes"></div>
      </div>
    </div>
  </div>
  <div class="foot">
    预览版说明：数量 = 运行次数(向上取整) × 每次消耗；尚未计入容器物品/流体/概率副产物/循环依赖，精确数值以游戏内导出模组为准。
  </div>
</div>

<script src="tree-data.js"></script>
<script>
(function () {
  "use strict";

  var state = { data: null, collapsed: {}, mode: "graph", scale: 1, tx: 30, ty: 30 };

  // 完成勾选状态（本地浏览器记忆，按物品 id 存 localStorage）
  function checkDone(id) {
    try { return localStorage.getItem("gtnh-check:local:" + id) === "1"; } catch (e) { return false; }
  }
  function setDone(id, done) {
    try { localStorage.setItem("gtnh-check:local:" + id, done ? "1" : "0"); } catch (e) {}
  }

  var HANDLER_NAMES = {
    "codechicken.nei.recipe.ShapedRecipeHandler": "工作台 · 有序合成",
    "codechicken.nei.recipe.ShapelessRecipeHandler": "工作台 · 无序合成",
    "codechicken.nei.recipe.FurnaceRecipeHandler": "熔炉 · 烧制",
    "gt.recipe.compressor": "GT 压缩机",
    "gt.recipe.category.macerator_recycling": "GT 研磨机 · 回收",
    "gt.recipe.macerator": "GT 研磨机",
    "gt.recipe.centrifuge": "GT 离心机",
    "gt.recipe.electrolyzer": "GT 电解机",
    "gt.recipe.assembler": "GT 组装机",
    "gt.recipe.chemical_reactor": "GT 化学反应釜",
    "gt.recipe.blast_furnace": "GT 高炉",
    "gt.recipe.alloy_smelter": "GT 合金炉",
    "gt.recipe.extractor": "GT 提取机",
    "gt.recipe.mixer": "GT 搅拌机",
    "gt.recipe.wiremill": "GT 线材轧机",
    "gt.recipe.bender": "GT 折弯机",
    "gt.recipe.lathe": "GT 车床",
    "gt.recipe.cutter": "GT 切割机",
    "gt.recipe.sifter": "GT 筛选机"
  };

  function friendlyMachine(recipe) {
    if (!recipe) return "";
    if (recipe.machine && recipe.machine !== recipe.handler) return recipe.machine;
    var h = recipe.handler || "";
    if (HANDLER_NAMES[h]) return HANDLER_NAMES[h];
    if (h.indexOf("gt.recipe.") === 0) return "GT 机器 · " + h.slice(10);
    if (h.indexOf("codechicken.nei.recipe.") === 0) return h.slice(24);
    return h;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderIcon(node) {
    if (node.icon) {
      var img = document.createElement("img");
      img.className = "item-icon";
      img.src = node.icon;
      img.alt = "";
      img.onerror = function () {
        var ph = document.createElement("span");
        ph.className = "item-icon ph";
        if (img.parentNode) img.parentNode.replaceChild(ph, img);
      };
      return img;
    }
    var ph = document.createElement("span");
    ph.className = "item-icon ph";
    return ph;
  }

  function isLeaf(node) { return !node.recipe || !node.children.length; }

  function renderAmounts(node) {
    var div = el("div", "amounts");
    var parts = [];
    parts.push("需要 " + node.amount + " 个");
    if (node.perCraft != null && node.perCraft !== 1) parts.push("每次消耗 ×" + node.perCraft);
    if (node.recipe) {
      if (node.produces !== 1) parts.push("单次产出 ×" + node.produces);
      if (node.runs > 1 && node.produces !== 1) parts.push("需运行 " + node.runs + " 次");
      if (node.leftover > 0) parts.push("(余 " + node.leftover + ")");
    }
    if (node.missing > 0) parts.push("⚠ 还有 " + node.missing + " 格原料未记录");
    div.appendChild(el("span", "need", parts[0]));
    for (var i = 1; i < parts.length; i++) {
      div.appendChild(document.createTextNode(" · "));
      var span = el("span", "amounts-extra", parts[i]);
      if (parts[i].indexOf("未记录") >= 0) span.style.color = "#e08080";
      div.appendChild(span);
    }
    if (isLeaf(node)) {
      div.appendChild(document.createTextNode(" · "));
      div.appendChild(el("span", "leaf-note", "采集 / 已有"));
    }
    return div;
  }

  function renderNode(node) {
    var wrap = el("div", "node" + (isLeaf(node) ? " leaf" : ""));
    var row = el("div", "node-row");

    var hasChildren = node.children && node.children.length > 0;
    var toggle = el("span", "toggle" + (hasChildren ? "" : " empty"), hasChildren ? "▾" : "·");
    var isCollapsed = !!state.collapsed[node.id + "@" + node.amount];
    if (hasChildren) {
      toggle.textContent = isCollapsed ? "▾" : "▸";
      toggle.addEventListener("click", function () {
        state.collapsed[node.id + "@" + node.amount] = !state.collapsed[node.id + "@" + node.amount];
        render();
      });
    }

    var body = el("div", "body");
    var nameLine = el("div", "name");
    nameLine.appendChild(renderIcon(node));
    var nameSpan = el("span", "item-name", node.name || node.id);
    nameSpan.title = node.id;
    nameLine.appendChild(nameSpan);
    if (node.recipe) {
      var m = friendlyMachine(node.recipe);
      if (m) nameLine.appendChild(el("span", "machine", m));
    }
    body.appendChild(nameLine);
    body.appendChild(renderAmounts(node));

    // 完成勾选框（右侧）
    var done = checkDone(node.id);
    var check = el("span", "check" + (done ? " done" : ""), done ? "✅" : "□");
    check.title = "标记完成";
    check.addEventListener("click", function () {
      var d = !checkDone(node.id);
      setDone(node.id, d);
      check.textContent = d ? "✅" : "□";
      check.classList.toggle("done", d);
      row.classList.toggle("done", d);
      updateStat();
    });
    if (done) row.classList.add("done");

    row.appendChild(toggle);
    row.appendChild(body);
    row.appendChild(check);
    wrap.appendChild(row);

    if (hasChildren) {
      var kids = el("div", "children");
      node.children.forEach(function (c) { kids.appendChild(renderNode(c)); });
      if (isCollapsed) kids.classList.add("hidden");
      wrap.appendChild(kids);
    }
    return wrap;
  }

  function graphNodeKey(node) { return node.id + "@" + node.amount; }

  function graphLeafCount(node) {
    if (state.collapsed[graphNodeKey(node)] || !node.children || !node.children.length) return 1;
    var total = 0;
    node.children.forEach(function (c) { total += graphLeafCount(c); });
    return Math.max(1, total);
  }

  function createGraphNode(node, x, y) {
    var wrap = el("div", "graph-node" + (checkDone(node.id) ? " done" : ""));
    wrap.style.left = x + "px";
    wrap.style.top = y + "px";
    wrap.dataset.nodeId = node.id;

    var top = el("div", "node-top");
    var hasChildren = node.children && node.children.length > 0;
    var collapsed = !!state.collapsed[graphNodeKey(node)];
    var toggle = el("span", "graph-toggle" + (hasChildren ? "" : " empty"), hasChildren ? (collapsed ? "▾" : "▸") : "·");
    if (hasChildren) toggle.addEventListener("click", function (e) {
      e.stopPropagation();
      state.collapsed[graphNodeKey(node)] = !state.collapsed[graphNodeKey(node)];
      render();
    });
    top.appendChild(toggle);
    top.appendChild(renderIcon(node));
    var name = el("div", "graph-name", node.name || node.id);
    name.title = node.id;
    top.appendChild(name);

    var done = checkDone(node.id);
    var check = el("span", "check" + (done ? " done" : ""), done ? "✅" : "□");
    check.title = "标记完成";
    check.addEventListener("click", function (e) {
      e.stopPropagation();
      var d = !checkDone(node.id);
      setDone(node.id, d);
      check.textContent = d ? "✅" : "□";
      check.classList.toggle("done", d);
      wrap.classList.toggle("done", d);
      updateStat();
    });
    top.appendChild(check);
    wrap.appendChild(top);

    var amount = renderAmounts(node);
    wrap.appendChild(amount);
    if (node.recipe) {
      var m = friendlyMachine(node.recipe);
      if (m) wrap.appendChild(el("span", "machine", m));
    }
    return wrap;
  }

  function renderGraph() {
    var view = document.getElementById("graphView");
    var nodesEl = document.getElementById("graphNodes");
    var svg = document.getElementById("graphLinks");
    nodesEl.innerHTML = "";
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    if (!state.data || !state.data.roots || !state.data.roots.length) return;

    var CARD_W = 220, CARD_H = 110, X_GAP = 70, Y_GAP = 24, LEAF_STEP = CARD_H + Y_GAP;
    var positions = [];
    var edges = [];
    var cursorY = 30;

    function layout(node, depth, startY) {
      var x = depth * (CARD_W + X_GAP) + 30;
      var children = (!state.collapsed[graphNodeKey(node)] && node.children && node.children.length) ? node.children : [];
      if (!children.length) {
        var y = startY;
        positions.push({ node: node, x: x, y: y });
        return { center: y + CARD_H / 2, height: LEAF_STEP };
      }
      var childStart = startY;
      var childResults = [];
      children.forEach(function (c) {
        var r = layout(c, depth + 1, childStart);
        childResults.push(r);
        childStart += r.height;
      });
      var minCenter = childResults[0].center;
      var maxCenter = childResults[childResults.length - 1].center;
      var y = (minCenter + maxCenter) / 2 - CARD_H / 2;
      if (y < startY) y = startY;
      positions.push({ node: node, x: x, y: y });
      children.forEach(function (c) { edges.push({ from: node, to: c }); });
      return { center: y + CARD_H / 2, height: Math.max(LEAF_STEP, childStart - startY) };
    }

    state.data.roots.forEach(function (root, i) {
      var r = layout(root, 0, cursorY);
      cursorY += r.height + 55;
    });

    var maxX = 0, maxY = 0;
    positions.forEach(function (p) {
      nodesEl.appendChild(createGraphNode(p.node, p.x, p.y));
      maxX = Math.max(maxX, p.x + CARD_W);
      maxY = Math.max(maxY, p.y + CARD_H);
    });
    var posMap = new Map();
    positions.forEach(function (p) { posMap.set(p.node, p); });
    svg.setAttribute("width", maxX + 60);
    svg.setAttribute("height", maxY + 60);
    svg.style.width = (maxX + 60) + "px";
    svg.style.height = (maxY + 60) + "px";
    nodesEl.style.width = (maxX + 60) + "px";
    nodesEl.style.height = (maxY + 60) + "px";
    document.getElementById("graphStage").style.width = (maxX + 60) + "px";
    document.getElementById("graphStage").style.height = (maxY + 60) + "px";

    edges.forEach(function (e) {
      var a = posMap.get(e.from), b = posMap.get(e.to);
      if (!a || !b) return;
      var x1 = a.x + CARD_W, y1 = a.y + CARD_H / 2;
      var x2 = b.x, y2 = b.y + CARD_H / 2;
      var mid = x1 + Math.max(22, (x2 - x1) / 2);
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", "graph-edge");
      path.setAttribute("d", "M " + x1 + " " + y1 + " C " + mid + " " + y1 + ", " + mid + " " + y2 + ", " + x2 + " " + y2);
      svg.appendChild(path);
    });
  }

  function applyGraphTransform() {
    var stage = document.getElementById("graphStage");
    stage.style.transform = "translate(" + state.tx + "px," + state.ty + "px) scale(" + state.scale + ")";
    document.getElementById("graphZoomLabel").textContent = Math.round(state.scale * 100) + "%";
  }

  function graphFit() {
    var vp = document.getElementById("graphViewport");
    var stage = document.getElementById("graphStage");
    if (!stage || !stage.offsetWidth || !stage.offsetHeight) return;
    var pad = 36;
    var sx = (vp.clientWidth - pad * 2) / stage.offsetWidth;
    var sy = (vp.clientHeight - pad * 2) / stage.offsetHeight;
    state.scale = Math.max(0.35, Math.min(1.15, Math.min(sx, sy)));
    state.tx = Math.max(pad, (vp.clientWidth - stage.offsetWidth * state.scale) / 2);
    state.ty = Math.max(pad, (vp.clientHeight - stage.offsetHeight * state.scale) / 2);
    applyGraphTransform();
  }

  function render() {
    var treeEl = document.getElementById("tree");
    treeEl.innerHTML = "";
    var metaEl = document.getElementById("meta");
    var statEl = document.getElementById("stat");
    var dropEl = document.getElementById("drop");
    var subEl = document.getElementById("subtitle");
    var graphView = document.getElementById("graphView");

    if (!state.data || !state.data.roots || !state.data.roots.length) {
      treeEl.innerHTML = "";
      metaEl.innerHTML = "";
      statEl.innerHTML = "";
      dropEl.style.display = "block";
      graphView.classList.add("hidden");
      return;
    }
    dropEl.style.display = "none";

    var d = state.data;
    var meta = [];
    meta.push("<b>" + d.roots.length + "</b> 个目标");
    if (d.exportedAt) meta.push("导出时间 " + d.exportedAt.replace("T", " ").slice(0, 19));
    if (d.source) meta.push("来源 " + d.source);
    metaEl.innerHTML = meta.join(" · ");

    updateStat();
    subEl.textContent = "数据源：" + (d.source || "JSON");

    d.roots.forEach(function (r) { treeEl.appendChild(renderNode(r)); });
    if (state.mode === "graph") {
      treeEl.classList.add("hidden");
      graphView.classList.remove("hidden");
      renderGraph();
      applyGraphTransform();
    } else {
      treeEl.classList.remove("hidden");
      graphView.classList.add("hidden");
    }
  }

  function countNodes(roots) {
    var n = 0;
    (function walk(list) {
      list.forEach(function (x) { n++; if (x.children) walk(x.children); });
    })(roots);
    return n;
  }

  function countDone(roots) {
    var n = 0;
    (function walk(list) {
      list.forEach(function (x) { if (checkDone(x.id)) n++; if (x.children) walk(x.children); });
    })(roots);
    return n;
  }

  function updateStat() {
    if (!state.data || !state.data.roots) return;
    var total = countNodes(state.data.roots);
    var done = countDone(state.data.roots);
    document.getElementById("stat").textContent = "共 " + total + " 个节点 · 已完成 " + done;
  }

  function loadData(obj) {
    if (obj && typeof obj === "object" && obj.roots) {
      state.data = obj;
      state.collapsed = {};
      render();
    } else {
      alert("这不是有效的合成树 JSON（缺少 roots 字段）");
    }
  }

  // 1) 双击打开时：tree-data.js 内嵌的数据
  if (window.TREE_DATA) loadData(window.TREE_DATA);

  // 2) 通过 http 提供时：自动拉取 tree.json
  if (!state.data) {
    fetch("tree.json")
      .then(function (r) { if (r.ok) return r.json(); throw new Error("no tree.json"); })
      .then(loadData)
      .catch(function () { render(); });
  }

  // 3) 拖拽 / 文件选择
  var fileInput = document.getElementById("fileInput");
  document.getElementById("openFile").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    if (f) readFile(f);
    fileInput.value = "";
  });

  var dropEl = document.getElementById("drop");
  ["dragenter", "dragover"].forEach(function (ev) {
    dropEl.addEventListener(ev, function (e) { e.preventDefault(); dropEl.style.borderColor = "#4fc3f7"; });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    dropEl.addEventListener(ev, function (e) { e.preventDefault(); dropEl.style.borderColor = ""; });
  });
  dropEl.addEventListener("drop", function (e) {
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  function readFile(f) {
    var reader = new FileReader();
    reader.onload = function () {
      try { loadData(JSON.parse(reader.result)); }
      catch (err) { alert("解析 JSON 失败：" + err.message); }
    };
    reader.readAsText(f, "utf-8");
  }

  document.getElementById("expandAll").addEventListener("click", function () {
    state.collapsed = {}; render();
  });
  document.getElementById("collapseAll").addEventListener("click", function () {
    collapseAll(state.data && state.data.roots); render();
  });
  function collapseAll(roots) {
    if (!roots) return;
    roots.forEach(function (n) {
      if (n.children && n.children.length) {
        state.collapsed[n.id + "@" + n.amount] = true;
        collapseAll(n.children);
      }
    });
  }

  var listModeBtn = document.getElementById("listMode");
  var graphModeBtn = document.getElementById("graphMode");
  function setMode(mode) {
    state.mode = mode;
    listModeBtn.classList.toggle("active", mode === "list");
    graphModeBtn.classList.toggle("active", mode === "graph");
    render();
    if (mode === "graph") setTimeout(graphFit, 0);
  }
  listModeBtn.addEventListener("click", function () { setMode("list"); });
  graphModeBtn.addEventListener("click", function () { setMode("graph"); });

  document.getElementById("graphFit").addEventListener("click", graphFit);
  document.getElementById("graphZoomIn").addEventListener("click", function () {
    state.scale = Math.min(2.5, state.scale * 1.15); applyGraphTransform();
  });
  document.getElementById("graphZoomOut").addEventListener("click", function () {
    state.scale = Math.max(0.35, state.scale / 1.15); applyGraphTransform();
  });

  (function initGraphPanZoom() {
    var vp = document.getElementById("graphViewport");
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    vp.addEventListener("pointerdown", function (e) {
      // 点到展开/折叠按钮或完成勾选框时，不启动拖拽，让它们的 click 正常触发
      var t = e.target;
      if (t && t.closest && t.closest(".graph-toggle, .check")) return;
      dragging = true; sx = e.clientX; sy = e.clientY; ox = state.tx; oy = state.ty;
      vp.classList.add("dragging"); vp.setPointerCapture(e.pointerId);
    });
    vp.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      state.tx = ox + e.clientX - sx; state.ty = oy + e.clientY - sy; applyGraphTransform();
    });
    function endDrag() { dragging = false; vp.classList.remove("dragging"); }
    vp.addEventListener("pointerup", endDrag);
    vp.addEventListener("pointercancel", endDrag);
    vp.addEventListener("wheel", function (e) {
      e.preventDefault();
      var rect = vp.getBoundingClientRect();
      var px = e.clientX - rect.left, py = e.clientY - rect.top;
      var factor = e.deltaY < 0 ? 1.1 : 0.9;
      var next = Math.max(0.35, Math.min(2.5, state.scale * factor));
      var wx = (px - state.tx) / state.scale, wy = (py - state.ty) / state.scale;
      state.scale = next;
      state.tx = px - wx * next; state.ty = py - wy * next;
      applyGraphTransform();
    }, { passive: false });
  })();

  if (!state.data) render();
})();
</script>
</body>
</html>
